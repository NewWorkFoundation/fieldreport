name: Deploy staging
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
# Serialize staging and releases. Never cancel an in-flight migration or release.
concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Deploy verified commit to staging
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/release.mjs staging
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-artifacts/
          if-no-files-found: ignore
          retention-days: 90
