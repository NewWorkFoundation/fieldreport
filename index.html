    <title>Field Report</title>
    <script>
      (function () {
        try {
          var path = location.pathname
          var isV3 = /(?:^|\/)v3(?:\/|$)/.test(path)
          if (!isV3) {
            document.documentElement.classList.add('field-report')
            var theme = localStorage.getItem('fieldreport-theme')
            if (theme !== 'light' && theme !== 'dark') theme = 'light'
            if (theme === 'dark') {
              document.documentElement.classList.add('report-shell')
              document.documentElement.style.colorScheme = 'dark'
            } else {
              document.documentElement.style.colorScheme = 'light'
            }
          }
        } catch (e) {}
      })()
    </script>
  </head>

    <script type="module" src="/src/main.tsx"></script>
  </body>
